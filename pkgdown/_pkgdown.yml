url: https://thinkr-open.github.io/golem/

template:
  bootstrap: 5
  theme: nord
  bslib:
    # Palette, fonts and shapes shared with golemverse.org
    pkgdown-nav-height: 64px
    bg: "#FAF9F7"
    fg: "#1E252C"
    primary: "#F15522"
    secondary: "#38424F"
    info: "#7176B8"
    border-color: "#E7E3DD"
    border-radius: "8px"
    link-color: "#D9471A"
    link-hover-color: "#F15522"
    link-decoration: none
    code-color: "#38424F"
    code-bg: "#F0EDE8"
    pkgdown-footer-bg: "#1E252C"
    pkgdown-footer-color: "#B8C0C9"
    pkgdown-footer-border-color: "#1E252C"
    base_font: { google: "IBM Plex Sans" }
    heading_font: { google: { family: "Bricolage Grotesque", wght: "500..800" } }
    code_font: { google: "IBM Plex Mono" }

navbar:
  structure:
    left: [reference, articles, resources, news]
    right: [search, github, golemverse]
  components:
    contribute:
      text: Contribute
      href: articles/g-contribute.html
    golemverse:
      icon: fas fa-toolbox
      href: https://golemverse.org/
      aria-label: Golemverse
    resources:
      text: Resources
      href: articles/h-resources.html

footer:
  structure:
    left: thinkr
    right: [golemverse]
  components:
    thinkr: <a href="https://thinkr.fr/" target="_blank">© ThinkR - A French company of R experts</a>
    golemverse: <a href="https://golemverse.org/" target="_blank">Explore the Golemverse</a>
