stages:
  - deploy

deploy-shiny:
  stage: deploy
  image: rocker/verse:4.5.3
  variables:
    APPNAME: __APPNAME__
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - Rscript -e 'install.packages(c("remotes", "rsconnect"), repos = "https://cran.rstudio.com")'
    - Rscript -e 'remotes::install_deps(dependencies = TRUE, repos = "https://cran.rstudio.com"); remotes::install_local(".", dependencies = FALSE, upgrade = "never", repos = "https://cran.rstudio.com")'
  script:
    - Rscript -e 'required <- c("CONNECT_SERVER", "CONNECT_API_KEY"); missing <- required[vapply(required, function(x) Sys.getenv(x) == "", logical(1))]; if (length(missing) > 0) stop(sprintf("Missing CI variables: %s", paste(missing, collapse = ", ")), call. = FALSE); if (Sys.getenv("APPNAME") == "") stop("Set APPNAME before deploying.", call. = FALSE)'
    - Rscript -e 'rsconnect::connectApiUser(server = Sys.getenv("CONNECT_SERVER"), apiKey = Sys.getenv("CONNECT_API_KEY"), quiet = TRUE); rsconnect::deployApp(appDir = ".", appPrimaryDoc = "app.R", appName = Sys.getenv("APPNAME"), server = Sys.getenv("CONNECT_SERVER"), forceUpdate = TRUE)'
